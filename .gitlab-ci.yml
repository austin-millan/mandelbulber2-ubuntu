image: docker:dind

stages:
  - release
  - latest
before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
release:
  stage: release
  image: docker:dind
  only:
    - master
    - schedules
  #services:
  #  - docker:dind
  before_script:
    - apk add jq curl bash
    # Job-level before_script replaces the top-level one; login here so both
    # registries are authenticated before release.sh dual-pushes.
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker login -u $DOCKERHUB_USER -p $DOCKERHUB_SECRET
  script:
    - chmod +x release.sh
    - bash ./release.sh
